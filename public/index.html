<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>성경 텍스트 추출기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <div class="badge">Biblics Extractor</div>
        <h1>원하는 구절만 뽑아오기</h1>
        <p>
          구약/신약, 책, 장, 절 범위를 고르면 해당 페이지에서 텍스트를
          그대로 추출합니다.
        </p>
      </section>

      <section class="panel">
        <form id="verseForm" class="form">
          <label class="field">
            <span>구분</span>
            <select id="testament"></select>
          </label>

          <label class="field">
            <span>책</span>
            <select id="book"></select>
          </label>

          <div class="field">
            <span>언어</span>
            <div class="lang-options">
              <label>
                <input type="checkbox" id="langKo" checked />
                한글 (새번역)
              </label>
              <label>
                <input type="checkbox" id="langEn" />
                영어 (NIV)
              </label>
            </div>
          </div>

          <label class="field">
            <span>장</span>
            <input id="chapter" type="number" min="1" placeholder="예: 3" />
          </label>

          <div class="range">
            <label class="field">
              <span>시작 절</span>
              <input id="startVerse" type="number" min="1" placeholder="예: 1" />
            </label>
            <label class="field">
              <span>끝 절</span>
              <input id="endVerse" type="number" min="1" placeholder="예: 12" />
            </label>
          </div>

          <button type="submit" class="cta">텍스트 가져오기</button>
        </form>

        <div class="output">
          <div class="output-header">
            <h2>결과</h2>
            <div class="output-actions">
              <button type="button" id="downloadBtn" class="ghost">
                TXT 다운로드
              </button>
              <button type="button" id="downloadPptxBtn" class="ghost">
                PPTX 다운로드
              </button>
              <span id="source" class="source"></span>
            </div>
          </div>
          <pre id="outputText" class="output-text">
원하는 범위를 입력하고 실행하세요.
          </pre>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
